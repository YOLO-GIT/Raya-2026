<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="./src/output.css" />


    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Press Start 2P", cursive;
        }
    </style>
</head>

<body class="bg-black text-white h-screen flex items-center justify-center">

    <div class="stars"></div>
    <div id="flash" class="flash"></div>

    <div id="startScreen" class="game-screen">

        <div class="text-6xl mb-6">🌙</div>

        <h1 class="text-3xl mb-6">
            EID MUBARAK
        </h1>

        <p>
            Taqabbalallahu minna wa minkum
        </p>

        <button id="startBtn" class="start-text mt-10">
            PRESS START
        </button>

    </div>


    <div id="eidScreen" class="game-screen hidden">

        <h1 class="text-3xl mb-6">
            ✨ EID MUBARAK ✨
        </h1>

        <p>
            May your Eid be filled with happiness,
            peace and blessings.
        </p>

    </div>

    <script>
        const startBtn = document.getElementById("startBtn");
        const startScreen = document.getElementById("startScreen");
        const eidScreen = document.getElementById("eidScreen");
        const flash = document.getElementById("flash");

        startBtn.addEventListener("click", () => {

            startScreen.classList.add("fade-out");

            flash.classList.add("flash-active");

            setTimeout(() => {

                startScreen.style.display = "none";

                eidScreen.classList.remove("hidden");
                eidScreen.classList.add("fade-in");

            }, 500);

        });
    </script>
</body>

</html>
