<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kad Raya</title>
    <link rel="icon" type="image/x-icon" href="example/Kirbo.png" />
    <meta name="author" content="YOLO-GIT" />
    <meta http-equiv="refresh" content="120" />
    <!-- Add Open Graph tags for better social media sharing -->
    <meta property="og:title" content="Kad Raya" />
    <meta property="og:description" content="Raya 🌹🌹🌹" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="../example/Kirbo.png" />
    <link rel="stylesheet" href="./src/output.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Press Start 2P", cursive;
        }
    </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4">

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="fireworks">
        <div class="firework"></div>
        <div class="firework delay1"></div>
        <div class="firework delay2"></div>
        <div class="firework delay3"></div>
    </div>

    <div class="stars">
        <div class="stars-small"></div>
        <div class="stars-medium"></div>
        <div class="stars-big"></div>
    </div>
    <div id="flash" class="flash"></div>

    <!-- <div class="lantern left">🏮</div>
    <div class="lantern right">🏮</div>
    <div class="lantern small left2">🏮</div>
    <div class="lantern small right2">🏮</div> -->

    <div id="startScreen" class="game-screen w-full max-w-md sm:max-w-lg md:max-w-xl">

        <div class="text-3xl sm:text-4xl md:text-5xl float mb-6">🌙</div>
        <div class="corner-deco top-left hidden sm:block">🕌</div>
        <div class="corner-deco top-right hidden sm:block">🌙</div>
        <div class="corner-deco bottom-left hidden sm:block">🏮</div>
        <div class="corner-deco bottom-right hidden sm:block">⭐</div>

        <h1 class="text-xl sm:text-2xl md:text-2xl mb-6 pixel-3d title-glow">
            ✨ EID MUBARAK ✨
        </h1>

        <div class="pixel-divider">
            ================
        </div>

        <p class="mt-6 text-xs sm:text-sm">
            Taqabbalallahu minna wa minkum
        </p>

        <button id="startBtn" class="pixel-btn mt-10 text-xs sm:text-sm">
            <span class="start-text">PRESS START</span>
        </button>

    </div>


    <div id="eidScreen" class="game-screen hidden w-full max-w-md sm:max-w-lg md:max-w-xl">


        <h1 class="text-3xl mb-6">
            ✨ EID MUBARAK ✨
        </h1>

        <p>
            May your Eid be filled with happiness,
            peace and blessings.
        </p>

    </div>

    <div class="music-player flex flex-wrap justify-center items-center gap-2 text-center">
        <span class="hidden sm:inline">♪ Eid Theme</span>
        <span class="sm:hidden">♪ Eid</span>
        <button id="musicToggle">UNMUTE</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="./music/" type="audio/mpeg">
    </audio>

    <script>
        const startBtn = document.getElementById("startBtn");
        const startScreen = document.getElementById("startScreen");
        const eidScreen = document.getElementById("eidScreen");
        const flash = document.getElementById("flash");

        startBtn.addEventListener("click", () => {

            startScreen.classList.add("fade-out");

            flash.classList.add("flash-active");

            setTimeout(() => {

                startScreen.style.display = "none";

                eidScreen.classList.remove("hidden");
                eidScreen.classList.add("fade-in");

            }, 600);

        });

        const music = document.getElementById("bgMusic");
        const toggleBtn = document.getElementById("musicToggle");

        let isPlaying = false;

        toggleBtn.addEventListener("click", () => {

            if (!isPlaying) {
                music.play();
                toggleBtn.textContent = "MUTE";
                isPlaying = true;
            } else {
                music.pause();
                toggleBtn.textContent = "UNMUTE";
                isPlaying = false;
            }

        });
    </script>
</body>

</html>
