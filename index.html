<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="./src/output.css" />


    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Press Start 2P", cursive;
        }
    </style>
</head>

<body class=" text-white h-screen flex items-center justify-center">

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="fireworks">
        <div class="firework"></div>
        <div class="firework delay1"></div>
        <div class="firework delay2"></div>
        <div class="firework delay3"></div>
    </div>

    <div class="stars">
        <div class="stars-small"></div>
        <div class="stars-medium"></div>
        <div class="stars-big"></div>
    </div>
    <div id="flash" class="flash"></div>

    <!-- <div class="lantern left">🏮</div>
    <div class="lantern right">🏮</div>
    <div class="lantern small left2">🏮</div>
    <div class="lantern small right2">🏮</div> -->

    <div id="startScreen" class="game-screen">

        <div class="text-5xl float mb-6">🌙</div>
        <div class="corner-deco top-left">🕌</div>
        <div class="corner-deco top-right">🌙</div>
        <div class="corner-deco bottom-left">🏮</div>
        <div class="corner-deco bottom-right">⭐</div>

        <h1 class="text-3xl mb-6 pixel-3d title-glow">
            ✨ EID MUBARAK ✨
        </h1>

        <div class="pixel-divider">
            ================
        </div>

        <p class="mt-6">
            Taqabbalallahu minna wa minkum
        </p>

        <button id="startBtn" class="pixel-btn mt-10">
            <span class="start-text">PRESS START</span>
        </button>

    </div>


    <div id="eidScreen" class="game-screen hidden">


        <h1 class="text-3xl mb-6">
            ✨ EID MUBARAK ✨

        </h1>

        <p>
            May your Eid be filled with happiness,
            peace and blessings.
        </p>

    </div>

    <script>
        const startBtn = document.getElementById("startBtn");
        const startScreen = document.getElementById("startScreen");
        const eidScreen = document.getElementById("eidScreen");
        const flash = document.getElementById("flash");

        startBtn.addEventListener("click", () => {

            startScreen.classList.add("fade-out");

            flash.classList.add("flash-active");

            setTimeout(() => {

                startScreen.style.display = "none";

                eidScreen.classList.remove("hidden");
                eidScreen.classList.add("fade-in");

            }, 600);

        });
    </script>
</body>

</html>
